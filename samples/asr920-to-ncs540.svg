<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1042" viewBox="0 0 1280 1042" role="img" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<title>ASR 920 to NCS 540 like-for-like migration</title>
<desc>ASR 920 to NCS 540 like-for-like migration. Current state: Cisco ASR 920 (IOS XE) with uplinks into Network. Target state: those links on Cisco NCS 540 (IOS XR). Controller Cisco Crosswork Network Controller. Crosswork Workflow Manager runs the stages. NSO commits each stage template. Stages: 1 Uplink move, 2 IS-IS, 3 SR-MPLS, 4 VPN services. Interface names that are missing are unlabeled.</desc>
<defs>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3412"/></marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57534e"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="1042" fill="#f3f0e8"/>
<rect x="0" y="0" width="1280" height="92" fill="#172033"/>
<text x="24" y="20" fill="#ffffff" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="hanging">ASR 920 to NCS 540 like-for-like migration</text>
<text x="24" y="54" fill="#d6deea" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="hanging">like-for-like   ·   Cisco ASR 920 (IOS XE)   →   Cisco NCS 540 (IOS XR)</text>
<rect x="1160" y="32" width="96" height="28" fill="#7c2d12" rx="14" ry="14"/>
<text x="1208" y="46" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central">BLOCKED</text>
<rect x="24" y="106" width="1232" height="42" fill="#fffdf8" rx="10" ry="10" stroke="#e3dcd1" stroke-width="1"/>
<text x="640" y="127" fill="#1c1917" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central">1   Uplink move    →    2   IS-IS    →    3   SR-MPLS    →    4   VPN services</text>
<rect x="24" y="164" width="558" height="424" fill="#fffdf8" rx="16" ry="16" stroke="#e3dcd1" stroke-width="1.50"/>
<text x="42" y="180" fill="#57534e" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="hanging">CURRENT</text>
<text x="564" y="180" fill="#8a8178" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="hanging">uplinks on the source</text>
<text x="303" y="212" fill="#57534e" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">Far-end peers and interfaces are not recorded</text>
<ellipse cx="303" cy="272" rx="86" ry="28" fill="#ece7dc" stroke="#78716c" stroke-width="1.50"/>
<text x="303" y="272" fill="#1c1917" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">Network</text>
<line x1="249.68" y1="300" x2="196" y2="340" stroke="#8a8175" stroke-width="1.75" stroke-linecap="round"/>
<circle cx="249.68" cy="300" r="3.20" fill="#8a8175"/>
<line x1="196" y1="426" x2="207" y2="462" stroke="#8a8175" stroke-width="1.75" stroke-linecap="round"/>
<circle cx="207" cy="462" r="3.20" fill="#8a8175"/>
<circle cx="196" cy="340" r="3.20" fill="#8a8175"/>
<circle cx="196" cy="426" r="3.20" fill="#8a8175"/>
<line x1="356.32" y1="300" x2="410" y2="340" stroke="#8a8175" stroke-width="1.75" stroke-linecap="round"/>
<circle cx="356.32" cy="300" r="3.20" fill="#8a8175"/>
<line x1="410" y1="426" x2="399" y2="462" stroke="#8a8175" stroke-width="1.75" stroke-linecap="round"/>
<circle cx="399" cy="462" r="3.20" fill="#8a8175"/>
<circle cx="410" cy="340" r="3.20" fill="#8a8175"/>
<circle cx="410" cy="426" r="3.20" fill="#8a8175"/>
<g>
<title>Which physical link moves first is not recorded.</title>
<rect x="97" y="340" width="198" height="86" fill="#fff4e6" rx="10" ry="10" stroke="#f0b27a" stroke-width="1.50"/>
<text x="196" y="350" fill="#1c1917" font-size="13" font-weight="650" text-anchor="middle" dominant-baseline="hanging">Ethernet uplink 1</text>
<text x="196" y="367" fill="#8a8178" font-size="10" font-weight="400" text-anchor="middle" dominant-baseline="hanging">source port</text>
<text x="196" y="381" fill="#9a3412" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="hanging">unlabeled</text>
<text x="196" y="401" fill="#9a3412" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="hanging">move order not recorded</text>
</g>
<g>
<title>Moves after uplink 1 has been moved and checked. The physical port is not recorded.</title>
<rect x="311" y="340" width="198" height="86" fill="#fff4e6" rx="10" ry="10" stroke="#f0b27a" stroke-width="1.50"/>
<text x="410" y="350" fill="#1c1917" font-size="13" font-weight="650" text-anchor="middle" dominant-baseline="hanging">Ethernet uplink 2</text>
<text x="410" y="367" fill="#8a8178" font-size="10" font-weight="400" text-anchor="middle" dominant-baseline="hanging">source port</text>
<text x="410" y="381" fill="#9a3412" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="hanging">unlabeled</text>
<text x="410" y="401" fill="#9a3412" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="hanging">move order not recorded</text>
</g>
<rect x="153" y="462" width="300" height="108" fill="#1b3a4b" rx="12" ry="12"/>
<text x="303" y="474" fill="#d6e2ea" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="hanging">CISCO</text>
<text x="303" y="490" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="hanging">ASR 920</text>
<text x="303" y="516" fill="#d6e2ea" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="hanging">IOS XE</text>
<text x="303" y="536" fill="#f3d3b0" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="hanging">NSO device name not recorded</text>
<rect x="698" y="164" width="558" height="424" fill="#fffdf8" rx="16" ry="16" stroke="#e3dcd1" stroke-width="1.50"/>
<text x="716" y="180" fill="#57534e" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="hanging">TARGET</text>
<text x="1238" y="180" fill="#8a8178" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="hanging">uplinks on the target</text>
<text x="977" y="212" fill="#57534e" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">Far-end peers and interfaces are not recorded</text>
<ellipse cx="977" cy="272" rx="86" ry="28" fill="#ece7dc" stroke="#78716c" stroke-width="1.50"/>
<text x="977" y="272" fill="#1c1917" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">Network</text>
<line x1="923.68" y1="300" x2="870" y2="340" stroke="#8a8175" stroke-width="1.75" stroke-linecap="round"/>
<circle cx="923.68" cy="300" r="3.20" fill="#8a8175"/>
<line x1="870" y1="426" x2="881" y2="462" stroke="#8a8175" stroke-width="1.75" stroke-linecap="round"/>
<circle cx="881" cy="462" r="3.20" fill="#8a8175"/>
<circle cx="870" cy="340" r="3.20" fill="#8a8175"/>
<circle cx="870" cy="426" r="3.20" fill="#8a8175"/>
<line x1="1030.32" y1="300" x2="1084" y2="340" stroke="#8a8175" stroke-width="1.75" stroke-linecap="round"/>
<circle cx="1030.32" cy="300" r="3.20" fill="#8a8175"/>
<line x1="1084" y1="426" x2="1073" y2="462" stroke="#8a8175" stroke-width="1.75" stroke-linecap="round"/>
<circle cx="1073" cy="462" r="3.20" fill="#8a8175"/>
<circle cx="1084" cy="340" r="3.20" fill="#8a8175"/>
<circle cx="1084" cy="426" r="3.20" fill="#8a8175"/>
<g>
<title>Which physical link moves first is not recorded.</title>
<rect x="771" y="340" width="198" height="86" fill="#fff4e6" rx="10" ry="10" stroke="#f0b27a" stroke-width="1.50"/>
<text x="870" y="350" fill="#1c1917" font-size="13" font-weight="650" text-anchor="middle" dominant-baseline="hanging">Ethernet uplink 1</text>
<text x="870" y="367" fill="#8a8178" font-size="10" font-weight="400" text-anchor="middle" dominant-baseline="hanging">target port</text>
<text x="870" y="381" fill="#9a3412" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="hanging">unlabeled</text>
<text x="870" y="401" fill="#9a3412" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="hanging">move order not recorded</text>
</g>
<g>
<title>Moves after uplink 1 has been moved and checked. The physical port is not recorded.</title>
<rect x="985" y="340" width="198" height="86" fill="#fff4e6" rx="10" ry="10" stroke="#f0b27a" stroke-width="1.50"/>
<text x="1084" y="350" fill="#1c1917" font-size="13" font-weight="650" text-anchor="middle" dominant-baseline="hanging">Ethernet uplink 2</text>
<text x="1084" y="367" fill="#8a8178" font-size="10" font-weight="400" text-anchor="middle" dominant-baseline="hanging">target port</text>
<text x="1084" y="381" fill="#9a3412" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="hanging">unlabeled</text>
<text x="1084" y="401" fill="#9a3412" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="hanging">move order not recorded</text>
</g>
<rect x="827" y="462" width="300" height="108" fill="#115e59" rx="12" ry="12"/>
<text x="977" y="474" fill="#d6e2ea" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="hanging">CISCO</text>
<text x="977" y="490" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="hanging">NCS 540</text>
<text x="977" y="516" fill="#d6e2ea" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="hanging">IOS XR</text>
<text x="977" y="536" fill="#f3d3b0" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="hanging">NSO device name not recorded</text>
<line x1="604" y1="383" x2="668" y2="383" stroke="#9a3412" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<text x="640" y="365" fill="#9a3412" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="hanging">Uplink move</text>
<text x="640" y="393" fill="#9a3412" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="hanging">first stage</text>
<text x="24" y="602" fill="#57534e" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="hanging">Ethernet uplink 1: Which physical link moves first is not recorded.</text>
<text x="24" y="620" fill="#57534e" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="hanging">Ethernet uplink 2: Moves after uplink 1 has been moved and checked. The physical port is not recorded.</text>
<rect x="24" y="662" width="1232" height="356" fill="#fffdf8" rx="16" ry="16" stroke="#e3dcd1" stroke-width="1.50"/>
<text x="42" y="680" fill="#57534e" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="hanging">CONTROLLER</text>
<text x="42" y="700" fill="#1c1917" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="hanging">Cisco Crosswork Network Controller (CNC)</text>
<text x="42" y="730" fill="#57534e" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="hanging">NSO is embedded in CNC.</text>
<rect x="40" y="764" width="210" height="146" fill="#312e81" rx="12" ry="12"/>
<text x="145" y="778" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="hanging">CWM</text>
<text x="145" y="802" fill="#e0e7ff" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">Crosswork Workflow Manager</text>
<text x="145" y="822" fill="#e7e5e4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">Runs each stage and that</text>
<text x="145" y="838" fill="#e7e5e4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">stage&#x27;s rollback.</text>
<g>
<title>Both ethernet uplinks move from the ASR 920 onto the NCS 540 before IS-IS, SR-MPLS, or VPN work.</title>
<rect x="278" y="784.50" width="164" height="105" fill="#fffcf7" rx="10" ry="10" stroke="#e3dcd1" stroke-width="1"/>
<circle cx="360" cy="807.50" r="10" fill="#b45309"/>
<text x="360" y="807.50" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text x="360" y="822.50" fill="#1c1917" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="hanging">Uplink move</text>
<text x="360" y="843.50" fill="#57534e" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">device template</text>
</g>
<line x1="443" y1="837" x2="455" y2="837" stroke="#8a8178" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<g>
<title>IS-IS device template, after both uplinks are on the NCS 540.</title>
<rect x="456" y="784.50" width="164" height="105" fill="#fffcf7" rx="10" ry="10" stroke="#e3dcd1" stroke-width="1"/>
<circle cx="538" cy="807.50" r="10" fill="#1d4ed8"/>
<text x="538" y="807.50" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<text x="538" y="822.50" fill="#1c1917" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="hanging">IS-IS</text>
<text x="538" y="843.50" fill="#57534e" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">device template</text>
</g>
<line x1="621" y1="837" x2="633" y2="837" stroke="#8a8178" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<g>
<title>SR-MPLS device template, after IS-IS.</title>
<rect x="634" y="784.50" width="164" height="105" fill="#fffcf7" rx="10" ry="10" stroke="#e3dcd1" stroke-width="1"/>
<circle cx="716" cy="807.50" r="10" fill="#0f766e"/>
<text x="716" y="807.50" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text x="716" y="822.50" fill="#1c1917" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="hanging">SR-MPLS</text>
<text x="716" y="843.50" fill="#57534e" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">device template</text>
</g>
<line x1="799" y1="837" x2="811" y2="837" stroke="#8a8178" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
<g>
<title>L2VPN and L3VPN, and config tied to those services.</title>
<rect x="812" y="784.50" width="164" height="105" fill="#fffcf7" rx="10" ry="10" stroke="#e3dcd1" stroke-width="1"/>
<circle cx="894" cy="807.50" r="10" fill="#6d28d9"/>
<text x="894" y="807.50" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text x="894" y="822.50" fill="#1c1917" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="hanging">VPN services</text>
<text x="894" y="843.50" fill="#57534e" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">service template or</text>
<text x="894" y="859.50" fill="#57534e" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">L2VPN/L3VPN package</text>
</g>
<rect x="1004" y="764" width="236" height="146" fill="#14532d" rx="12" ry="12"/>
<text x="1122" y="778" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="hanging">NSO</text>
<text x="1122" y="808" fill="#e7e5e4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">Renders and commits the</text>
<text x="1122" y="824" fill="#e7e5e4" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="hanging">template for each stage.</text>
<text x="1122" y="846" fill="#d1fae5" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="hanging">commits to</text>
<text x="1122" y="862" fill="#ffffff" font-size="13" font-weight="650" text-anchor="middle" dominant-baseline="hanging">ASR 920</text>
<text x="1122" y="878" fill="#ffffff" font-size="13" font-weight="650" text-anchor="middle" dominant-baseline="hanging">NCS 540</text>
<line x1="250" y1="837" x2="278" y2="837" stroke="#57534e" stroke-width="1.50" stroke-linecap="round" marker-end="url(#arrow-ink)"/>
